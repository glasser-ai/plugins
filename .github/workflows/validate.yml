name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cursor template checks
        run: node scripts/validate-template.mjs
      - name: Manifest consistency
        run: node scripts/check-manifests.mjs
