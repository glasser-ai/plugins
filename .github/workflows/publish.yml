name: publish

on:
  pull_request:
    paths:
      - "plugins/glasser/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

jobs:
  # Every PR that touches the package previews the publish. Nothing is uploaded.
  dry-run:
    if: github.event_name == 'pull_request'
    # The reusable job declares id-token: write, and a called workflow cannot
    # hold more than the caller grants, so this has to match even for a preview.
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.23.3
    with:
      dry_run: true
      owner: glasser-ai
      family: bundle-plugin
      source_path: plugins/glasser

  # Real publish, run by hand once a version bump has landed on main.
  # id-token lets ClawHub mint a short-lived token from the OIDC claim, so the
  # repository stores no ClawHub credential.
  publish:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.23.3
    with:
      dry_run: false
      # No owner here. A trusted publish takes the owner from the OIDC claim
      # and the package's trusted-publisher config; passing it is refused with
      # "Trusted publishes must not override the package owner".
      family: bundle-plugin
      source_path: plugins/glasser
